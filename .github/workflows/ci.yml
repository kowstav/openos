name: CI
# Release gates (S3): every push/PR must pass lint, typecheck, unit/integration
# tests and the production build. Host-execution eval stays quarantined
# (OPENOS_RUN_HOST_EVAL is never set here). Live sandbox proof is a separate
# credential-gated job that skips without secrets instead of faking a pass.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Worker syntax (no Modal credentials needed)
        run: python3 -m py_compile workers/modal_runner.py
  browser:
    # REQUIRED credential-free browser job against the production build.
    # The official Playwright image ships the version-matched Chromium and
    # its OS libraries, so a missing local libatk can never masquerade as a
    # product failure. Clean data dir; journeys create their own users/apps
    # through normal routes; skipped required journeys fail the job.
    runs-on: ubuntu-latest
    needs: verify
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Start production server (clean data) and run browser journeys
        env:
          OPENOS_DATA_DIR: /tmp/openos-e2e-data
          E2E_BASE: http://127.0.0.1:3100
          SHOT_DIR: /tmp/openos-shots
        run: |
          rm -rf /tmp/openos-e2e-data /tmp/openos-shots
          npm run start -- -p 3100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/health && break || sleep 2; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            /tmp/openos-shots
          retention-days: 14
  live-smoke:
    # Disposable, credential-gated: without secrets the script prints SKIP
    # and exits 0. With secrets it must prove isolation or fail the job.
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ vars.OPENOS_LIVE_SMOKE == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Start server and run live smoke
        env:
          SANDBOX_PROVIDER: ${{ secrets.SANDBOX_PROVIDER }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          npm run start -- -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break || sleep 2; done
          OPENOS_URL=http://localhost:3000 node scripts/live-smoke.mjs
